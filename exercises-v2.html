<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Core — Тренировки v2</title>
<script src="js/workouts-new/workouts-schema.js"></script>
<script src="js/workouts-new/workouts-store.js"></script>
<script src="js/workouts-new/workouts-seed.js"></script>
<script src="js/workouts-new/workouts-init.js"></script>
<script src="js/workouts-new/workout-parser.js"></script>
<script src="js/workouts-new/workout-importer.js"></script>
<link rel="stylesheet" href="css/workouts-v2.css">
</head>
<body>
<div class="v2-container">

  <div class="v2-top-bar">
    <a href="index.html" class="v2-back-link">← Назад</a>
    <span class="v2-badge">v2</span>
  </div>

  <div class="v2-tabs">
    <button class="v2-tab active" id="v2-tab-exercises" onclick="switchTab('exercises')">📋 Упражнения</button>
    <button class="v2-tab" id="v2-tab-workouts" onclick="switchTab('workouts')">🏋️ Тренировки</button>
    <button class="v2-tab" id="v2-tab-review" onclick="switchTab('review')">⚠️ Требует проверки <span class="v2-tab-badge" id="v2-review-count">0</span></button>
    <button class="v2-tab" id="v2-tab-import" onclick="switchTab('import')">📥 Импорт</button>
  </div>

  <!-- 📋 Упражнения -->
  <div class="v2-tab-content active" id="v2-tab-content-exercises">
    <div class="v2-controls">
      <input type="text" class="v2-search" id="v2-search" placeholder="🔍 Поиск..." oninput="renderExList()">
      <select class="v2-filter" id="v2-filter-muscle" onchange="renderExList()"></select>
      <select class="v2-filter" id="v2-filter-load" onchange="renderExList()">
        <option value="all">Все типы</option>
        <option value="strength">💪 Силовое</option>
        <option value="cardio">🏃 Кардио</option>
        <option value="bodyweight">🤸 Без веса</option>
        <option value="other">📌 Другое</option>
      </select>
      <span class="v2-stats" id="v2-stats"></span>
    </div>
    <div class="v2-list" id="v2-exercise-list">
      <div class="v2-empty"><div class="v2-empty-icon">🏋️</div><div class="v2-empty-title">Загрузка...</div></div>
    </div>
  </div>

  <!-- 🏋️ Тренировки -->
  <div class="v2-tab-content" id="v2-tab-content-workouts">
    <div class="v2-list" id="v2-workout-list">
      <div class="v2-empty"><div class="v2-empty-icon">🏋️</div><div class="v2-empty-title">Нет тренировок</div></div>
    </div>
  </div>

  <!-- ⚠️ Требует проверки -->
  <div class="v2-tab-content" id="v2-tab-content-review">
    <div class="v2-list" id="v2-unmatched-list">
      <div class="v2-empty"><div class="v2-empty-icon">✅</div><div class="v2-empty-title">Нет записей</div></div>
    </div>
  </div>

  <!-- 📥 Импорт -->
  <div class="v2-tab-content" id="v2-tab-content-import">
    <div class="v2-import-card">
      <div class="v2-import-meta">
        <input type="date" id="v2-import-date">
        <input type="number" id="v2-import-duration" placeholder="мин" min="0">
      </div>
      <textarea class="v2-import-ta" id="v2-import-text" placeholder="Вставьте текст тренировки&#10;&#10;26 июля 2026, 60 мин&#10;1) Жим лежа · штанга&#10;80кг*8&#10;80кг*7&#10;2) Приседания со штангой&#10;100кг*5"></textarea>
      <div class="v2-import-actions">
        <button class="v2-btn v2-btn-primary" onclick="runParse()">🔍 Разобрать</button>
        <button class="v2-btn" onclick="clearImport()">🗑 Очистить</button>
      </div>
    </div>
    <div id="v2-import-preview"></div>
  </div>

</div>

<script>setTimeout(initV2, 100);</script>
</body>
</html>
